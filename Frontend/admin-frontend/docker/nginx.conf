# Run the admin frontend on its own internal container port.
server {
  # Listen on the admin frontend port expected by ECS target groups.
  listen 8911;

  # Keep redirects relative so external users never see the internal container port.
  absolute_redirect off;

  # Serve files from the parent web root because the app lives under /admin-console.
  root /usr/share/nginx/html;

  # Use the Vite-generated index file as the default page inside /admin-console.
  index index.html;

  # Provide a cheap health endpoint for ECS and load balancer checks.
  location = /health {
    # Return a simple successful response without touching the React app.
    return 200 "ok\n";
  }

  # Runtime deployment config is generated from ECS environment variables.
  location = /admin-console/runtime-config.js {
    try_files $uri =404;
    add_header Cache-Control "no-store";
  }

  # Send bare-root visits to the admin app base path.
  location = / {
    # Keep the public entrypoint consistent with Vite's configured base URL.
    return 302 /admin-console/;
  }

  # Cache immutable Vite assets aggressively because filenames include hashes.
  location /admin-console/assets/ {
    # Return the real file or a 404 if the asset path is invalid.
    try_files $uri =404;
    # Tell browsers and CDNs these hashed assets are safe to cache.
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # Let direct page refreshes for admin React routes load the SPA entrypoint.
  location /admin-console/ {
    # Prefer a real file first, then fall back to the admin index for client routing.
    try_files $uri $uri/ /admin-console/index.html;
  }
}
