# Run the customer frontend on its own internal container port.
server {
  # Listen on the customer frontend port expected by ECS target groups.
  listen 8910;

  # Serve files from the Vite build output copied into the image.
  root /usr/share/nginx/html;

  # Use the Vite-generated index file as the default page.
  index index.html;

  # Provide a cheap health endpoint for ECS and load balancer checks.
  location = /health {
    # Return a simple successful response without touching the React app.
    return 200 "ok\n";
  }

  # Runtime deployment config is generated from ECS environment variables.
  location = /runtime-config.js {
    try_files $uri =404;
    add_header Cache-Control "no-store";
  }

  # Cache immutable Vite assets aggressively because filenames include hashes.
  location /assets/ {
    # Return the real file or a 404 if the asset path is invalid.
    try_files $uri =404;
    # Tell browsers and CDNs these hashed assets are safe to cache.
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # Let direct page refreshes for React routes load the SPA entrypoint.
  location / {
    # Prefer a real file first, then fall back to index.html for client routing.
    try_files $uri $uri/ /index.html;
  }
}
